<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSE F&O Live Dashboard</title>
<style>
  :root {
    --bg: #0a0d10;
    --panel: #12171c;
    --panel-2: #161c22;
    --line: #232b32;
    --text: #eef2f5;
    --muted: #7c8894;
    --green: #22c58e;
    --green-bg: rgba(34,197,142,0.12);
    --red: #f0554f;
    --red-bg: rgba(240,85,79,0.12);
    --amber: #e8ab3d;
    --amber-bg: rgba(232,171,61,0.12);
    --accent: #4fa8f0;
    --mono: 'JetBrains Mono', 'Consolas', monospace;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    margin: 0;
    padding: 24px;
    font-size: 13px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .title-block h1 {
    font-size: 17px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text);
    margin: 0;
  }
  .title-block .sub {
    color: var(--muted);
    font-size: 11px;
    margin-top: 2px;
  }
  #status {
    color: var(--muted);
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #status.error { color: var(--red); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  #status.error .dot { background: var(--red); }

  .index-strip {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .index-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 18px;
    min-width: 140px;
  }
  .index-card .label { color: var(--muted); font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; }
  .index-card .value { font-size: 19px; margin-top: 5px; font-weight: 600; }
  .index-card .change { font-size: 11px; margin-top: 3px; }
  .up { color: var(--green); }
  .down { color: var(--red); }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    color: var(--muted);
    font-size: 11px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  th, td {
    padding: 9px 12px;
    text-align: right;
    white-space: nowrap;
  }
  td { border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th {
    color: var(--muted);
    font-weight: 500;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    position: sticky;
    top: 0;
    background: var(--panel-2);
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid var(--line);
  }
  th:hover { color: var(--text); }
  th .arrow { display: inline-block; width: 10px; opacity: 0.5; font-size: 9px; }
  th.sorted .arrow { opacity: 1; color: var(--accent); }

  tbody tr { transition: background 0.1s; }
  tbody tr:hover td { background: #1a2128; }

  .symbol-link {
    color: var(--text);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px dashed var(--muted);
    cursor: pointer;
  }
  .symbol-link:hover { color: var(--accent); border-bottom-color: var(--accent); }

  .change-pos { color: var(--green); font-weight: 600; }
  .change-neg { color: var(--red); font-weight: 600; }
  .change-zero { color: var(--muted); }

  .cell-pos { background: var(--green-bg); color: var(--green); font-weight: 600; }
  .cell-neg { background: var(--red-bg); color: var(--red); font-weight: 600; }

  .logo {
    width: 30px;
    height: 30px;
    border-radius: 7px;
    background: linear-gradient(160deg, #1c2530, #12171c);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-text .name {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--text);
  }
  .brand-text .tag {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-top: 1px;
  }

  .signal-cell {
    text-align: center;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.04em;
  }
  tr.sig-BUY td:last-child { background: var(--green-bg); color: var(--green); }
  tr.sig-SELL td:last-child { background: var(--red-bg); color: var(--red); }
  tr.sig-WATCH td:last-child { background: var(--amber-bg); color: var(--amber); }
  tr.sig-NO-SIGNAL td:last-child { color: var(--muted); }

  .table-wrap { max-height: 72vh; overflow: auto; border-radius: 8px; }
  #empty { color: var(--muted); padding: 40px; text-align: center; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="10" width="3" height="8" rx="0.5" fill="#22c58e"/>
        <rect x="9" y="4" width="3" height="14" rx="0.5" fill="#f0554f"/>
        <rect x="15" y="7" width="3" height="11" rx="0.5" fill="#22c58e"/>
        <rect x="21" y="2" width="0" height="0"/>
        <path d="M2 20 L22 20" stroke="#7c8894" stroke-width="1"/>
      </svg>
    </div>
    <div class="brand-text">
      <div class="name">MarketPulse</div>
      <div class="tag">NSE F&amp;O · 15min dashboard</div>
    </div>
  </div>
  <div id="status"><span class="dot"></span><span id="status-text">connecting...</span></div>
</header>

<div class="index-strip" id="indexStrip"></div>

<div class="controls">
  <span id="rowCount"></span>
  <span>Click any column header to sort</span>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr id="headerRow"></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="empty" style="display:none;">No data yet - waiting for first refresh (or backend needs Upstox login).</div>
</div>

<script>
  // Point this at wherever you deploy the FastAPI backend.
  const API_BASE = "https://fno-dashboard-production-2aba.up.railway.app";

  const COLUMNS = [
    { key: "symbol", label: "Symbol", numeric: false },
    { key: "ltp", label: "LTP", numeric: true },
    { key: "change_pct", label: "Change %", numeric: true },
    { key: "monthly_pivot", label: "Monthly Pivot", numeric: true },
    { key: "weekly_pivot", label: "Weekly Pivot", numeric: true },
    { key: "daily_pivot", label: "Daily Pivot", numeric: true },
    { key: "ema21", label: "EMA 21", numeric: true },
    { key: "high_26_candle", label: "26-Candle High", numeric: true },
    { key: "vwap", label: "VWAP", numeric: true },
    { key: "rsi14", label: "RSI 14", numeric: true },
    { key: "ema21_on_rsi", label: "EMA21 on RSI", numeric: true },
    { key: "signal", label: "Signal", numeric: false },
  ];

  let sortKey = "symbol";
  let sortDir = 1; // 1 = ascending, -1 = descending
  let latestRows = [];

  function fmt(n) {
    return (n === null || n === undefined) ? "—" : Number(n).toFixed(2);
  }

  function tradingViewUrl(symbol) {
    return `https://www.tradingview.com/chart/?symbol=NSE%3A${encodeURIComponent(symbol)}`;
  }

  function renderHeader() {
    const row = document.getElementById("headerRow");
    row.innerHTML = COLUMNS.map(col => {
      const isSorted = sortKey === col.key;
      const arrow = isSorted ? (sortDir === 1 ? "\u25B2" : "\u25BC") : "\u2195";
      return `<th data-key="${col.key}" class="${isSorted ? 'sorted' : ''}">${col.label} <span class="arrow">${arrow}</span></th>`;
    }).join("");
    row.querySelectorAll("th").forEach(th => {
      th.addEventListener("click", () => {
        const key = th.dataset.key;
        if (sortKey === key) {
          sortDir *= -1;
        } else {
          sortKey = key;
          sortDir = 1;
        }
        renderHeader();
        renderRows(latestRows);
      });
    });
  }

  function renderIndices(indices) {
    const strip = document.getElementById("indexStrip");
    strip.innerHTML = "";
    Object.entries(indices || {}).forEach(([name, v]) => {
      const changeClass = (v.change ?? 0) >= 0 ? "up" : "down";
      const arrow = (v.change ?? 0) >= 0 ? "\u25B2" : "\u25BC";
      strip.innerHTML += `
        <div class="index-card">
          <div class="label">${name}</div>
          <div class="value">${fmt(v.ltp)}</div>
          <div class="change ${changeClass}">${arrow} ${fmt(v.change)}</div>
        </div>`;
    });
  }

  function sortedRows(rows) {
    const copy = [...rows];
    copy.sort((a, b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (av === null || av === undefined) av = sortKey === "symbol" || sortKey === "signal" ? "" : -Infinity;
      if (bv === null || bv === undefined) bv = sortKey === "symbol" || sortKey === "signal" ? "" : -Infinity;
      if (typeof av === "string") {
        return av.localeCompare(bv) * sortDir;
      }
      return (av - bv) * sortDir;
    });
    return copy;
  }

  function renderRows(rows) {
    latestRows = rows || [];
    const tbody = document.getElementById("tbody");
    const empty = document.getElementById("empty");
    const rowCount = document.getElementById("rowCount");

    if (!rows || rows.length === 0) {
      tbody.innerHTML = "";
      empty.style.display = "block";
      rowCount.textContent = "";
      return;
    }
    empty.style.display = "none";
    rowCount.textContent = `${rows.length} stocks`;

    const sorted = sortedRows(rows);
    tbody.innerHTML = sorted.map(r => {
      const signalClass = "sig-" + (r.signal || "NO SIGNAL").replace(" ", "-");
      const changeVal = r.change_pct;
      let changeClass = "change-zero";
      let changeText = "\u2014";
      if (changeVal !== null && changeVal !== undefined) {
        changeClass = changeVal > 0 ? "change-pos" : changeVal < 0 ? "change-neg" : "change-zero";
        changeText = (changeVal > 0 ? "+" : "") + changeVal.toFixed(2) + "%";
      }

      // LTP above a level = bullish (green), below = bearish (red)
      const cellVsLtp = (val) => {
        if (val === null || val === undefined || r.ltp === null || r.ltp === undefined) return "";
        return r.ltp > val ? "cell-pos" : r.ltp < val ? "cell-neg" : "";
      };

      // RSI above its own EMA21 = bullish momentum (green), below = bearish (red)
      const rsiClass = (r.rsi14 !== null && r.ema21_on_rsi !== null && r.rsi14 !== undefined && r.ema21_on_rsi !== undefined)
        ? (r.rsi14 > r.ema21_on_rsi ? "cell-pos" : r.rsi14 < r.ema21_on_rsi ? "cell-neg" : "")
        : "";

      return `
        <tr class="${signalClass}">
          <td><a class="symbol-link" href="${tradingViewUrl(r.symbol)}" target="_blank" rel="noopener">${r.symbol}</a></td>
          <td>${fmt(r.ltp)}</td>
          <td class="${changeClass}">${changeText}</td>
          <td class="${cellVsLtp(r.monthly_pivot)}">${fmt(r.monthly_pivot)}</td>
          <td class="${cellVsLtp(r.weekly_pivot)}">${fmt(r.weekly_pivot)}</td>
          <td class="${cellVsLtp(r.daily_pivot)}">${fmt(r.daily_pivot)}</td>
          <td class="${cellVsLtp(r.ema21)}">${fmt(r.ema21)}</td>
          <td class="${cellVsLtp(r.high_26_candle)}">${fmt(r.high_26_candle)}</td>
          <td class="${cellVsLtp(r.vwap)}">${fmt(r.vwap)}</td>
          <td class="${rsiClass}">${fmt(r.rsi14)}</td>
          <td class="${rsiClass}">${fmt(r.ema21_on_rsi)}</td>
          <td class="signal-cell">${r.signal || "NO SIGNAL"}</td>
        </tr>`;
    }).join("");
  }

  async function refresh() {
    const statusEl = document.getElementById("status");
    const statusText = document.getElementById("status-text");
    try {
      const res = await fetch(`${API_BASE}/api/dashboard`);
      const data = await res.json();
      renderIndices(data.indices);
      renderRows(data.rows);
      if (data.error) {
        statusText.textContent = data.error;
        statusEl.classList.add("error");
      } else {
        statusText.textContent = "last updated: " + (data.last_updated || "\u2014");
        statusEl.classList.remove("error");
      }
    } catch (e) {
      statusText.textContent = "Cannot reach backend at " + API_BASE;
      statusEl.classList.add("error");
    }
  }

  renderHeader();
  refresh();
  setInterval(refresh, 30000); // poll every 30s; backend itself recomputes every 15min candle
</script>

</body>
</html>
